name: CV y pruebas visuales
on:
  push:
    branches: [main]
    paths:
      - 'tmp/pdfs/create_public_cv.py'
      - 'index.html'
      - 'proyectos.html'
      - 'proyectos/**'
      - 'sobre-mi.html'
      - 'assets/css/**'
      - 'assets/js/**'
      - 'tmp/visual-audit.cjs'
      - '.github/workflows/cv-visual.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generar CV público
        run: |
          python -m pip install reportlab pymupdf
          python tmp/pdfs/create_public_cv.py
          cp output/pdf/CV-Victor-Jimenez.pdf assets/documents/CV-Victor-Jimenez.pdf
          python - <<'PY'
          import fitz
          d=fitz.open('assets/documents/CV-Victor-Jimenez.pdf')
          assert len(d)==2, f'Se esperaban 2 páginas, hay {len(d)}'
          text=' '.join(p.get_text() for p in d)
          assert 'Aforo' in text and 'Google Play' in text
          print('CV verificado: 2 páginas, Aforo y Google Play presentes')
          PY
      - name: Instalar Chromium para pruebas
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verificación visual responsive
        run: node tmp/visual-audit.cjs
      - name: Evidencias visuales
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-cv-vic
          path: audit/screenshots/
          if-no-files-found: ignore
      - name: Publicar CV en main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/documents/CV-Victor-Jimenez.pdf output/pdf/CV-Victor-Jimenez.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Publicar CV actualizado con Aforo"
            git push
          fi
